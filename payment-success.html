<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | LUXORA</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(212,175,55,0.10), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(212,175,55,0.08), transparent 30%),
                #050505;
            color: #fff;
            overflow-x: hidden;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 76px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            background: rgba(5,5,5,0.85);
            backdrop-filter: blur(18px);

            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #fff3a1,
                #d4af37,
                #8b6914
            );

            color: #050505;

            box-shadow:
                0 0 25px rgba(212,175,55,0.35);
        }

        .logo-text {
            font-family: "Playfair Display", serif;
            font-size: 25px;
            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #fff,
                #d4af37,
                #fff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .secure {
            color: #aaa;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .secure i {
            color: #d4af37;
        }

        /* =========================
           BACKGROUND GLOW
        ========================= */

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(212,175,55,0.07);

            filter: blur(100px);

            pointer-events: none;
        }

        .glow.one {
            top: -250px;
            left: -200px;
        }

        .glow.two {
            right: -250px;
            bottom: -250px;
        }

        /* =========================
           MAIN
        ========================= */

        .success-container {
            min-height: calc(100vh - 76px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 20px;

            position: relative;
        }

        .success-card {
            width: 100%;
            max-width: 760px;

            padding: 50px;

            text-align: center;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(212,175,55,0.25);

            backdrop-filter: blur(25px);

            box-shadow:
                0 40px 100px rgba(0,0,0,0.7),
                inset 0 1px rgba(255,255,255,0.08);

            animation: cardEntrance 0.9s ease forwards;
        }

        @keyframes cardEntrance {

            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           SUCCESS ICON
        ========================= */

        .success-icon {
            width: 115px;
            height: 115px;

            margin: 0 auto 28px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background:
                radial-gradient(
                    circle,
                    rgba(212,175,55,0.25),
                    rgba(212,175,55,0.04)
                );

            border: 1px solid rgba(212,175,55,0.5);

            box-shadow:
                0 0 35px rgba(212,175,55,0.25);

            animation: iconFloat 3s ease-in-out infinite;
        }

        .success-icon::before,
        .success-icon::after {
            content: "";
            position: absolute;

            inset: -10px;

            border-radius: 50%;

            border: 1px solid rgba(212,175,55,0.25);

            animation: pulse 2s infinite;
        }

        .success-icon::after {
            inset: -22px;
            animation-delay: 0.5s;
        }

        @keyframes pulse {

            0% {
                opacity: 0.8;
                transform: scale(0.85);
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }

        @keyframes iconFloat {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .success-icon i {
            font-size: 52px;

            color: #d4af37;

            animation: checkPop 0.7s
                cubic-bezier(.17,.67,.35,1.4)
                0.5s both;
        }

        @keyframes checkPop {

            0% {
                transform: scale(0) rotate(-30deg);
                opacity: 0;
            }

            70% {
                transform: scale(1.2) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        /* =========================
           TEXT
        ========================= */

        .success-card h1 {
            font-family: "Playfair Display", serif;

            font-size: clamp(32px, 5vw, 48px);

            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                #fff,
                #d4af37,
                #fff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-size: 200% auto;

            animation: goldText 4s linear infinite;
        }

        @keyframes goldText {

            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            color: #aaa;

            font-size: 15px;

            line-height: 1.7;

            max-width: 550px;

            margin: 0 auto 30px;
        }

        /* =========================
           BOOKING ID
        ========================= */

        .booking-box {
            margin: 30px auto;

            max-width: 500px;

            padding: 18px 22px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-radius: 16px;

            background: rgba(212,175,55,0.07);

            border: 1px solid rgba(212,175,55,0.22);
        }

        .booking-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .booking-id {
            color: #d4af37;

            font-weight: 800;

            letter-spacing: 1.5px;

            font-size: 15px;
        }

        /* =========================
           DETAILS
        ========================= */

        .details {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin: 25px 0 35px;
        }

        .detail {
            padding: 18px 12px;

            border-radius: 15px;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.07);

            transition: 0.3s;
        }

        .detail:hover {
            transform: translateY(-5px);

            border-color: rgba(212,175,55,0.35);

            box-shadow:
                0 10px 30px rgba(212,175,55,0.08);
        }

        .detail i {
            color: #d4af37;

            font-size: 19px;

            margin-bottom: 9px;
        }

        .detail span {
            display: block;

            color: #888;

            font-size: 11px;

            margin-bottom: 5px;
        }

        .detail strong {
            font-size: 13px;
            color: #eee;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .btn {
            min-width: 190px;

            padding: 14px 24px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            transition: 0.35s;

            position: relative;

            overflow: hidden;
        }

        .btn-primary {
            color: #080808;

            background:
                linear-gradient(
                    135deg,
                    #fff0a0,
                    #d4af37,
                    #a47c16
                );

            box-shadow:
                0 10px 30px rgba(212,175,55,0.18);
        }

        .btn-primary:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 40px rgba(212,175,55,0.35);
        }

        .btn-secondary {
            color: #fff;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-secondary:hover {
            transform: translateY(-4px);

            border-color: #d4af37;

            color: #d4af37;
        }

        /* Button shine */

        .btn-primary::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.5),
                    transparent
                );

            transform: skewX(-20deg);

            animation: shine 3s infinite;
        }

        @keyframes shine {

            0% {
                left: -100%;
            }

            45%,100% {
                left: 150%;
            }
        }

        /* =========================
           FOOTER TEXT
        ========================= */

        .footer-text {
            margin-top: 30px;

            font-size: 12px;

            color: #666;
        }

        .footer-text i {
            color: #d4af37;
            margin-right: 5px;
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: fixed;

            width: 7px;
            height: 12px;

            top: -20px;

            pointer-events: none;

            animation:
                confettiFall linear forwards;
        }

        @keyframes confettiFall {

            0% {
                transform:
                    translateY(-20px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 700px) {

            .navbar {
                height: 68px;
                padding: 0 20px;
            }

            .logo-text {
                font-size: 20px;
                letter-spacing: 3px;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
            }

            .secure span {
                display: none;
            }

            .success-container {
                padding: 40px 15px;
            }

            .success-card {
                padding: 35px 20px;
                border-radius: 24px;
            }

            .success-icon {
                width: 95px;
                height: 95px;
            }

            .success-icon i {
                font-size: 42px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .booking-box {
                gap: 10px;
                flex-direction: column;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media(max-width: 400px) {

            .success-card h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>

    <!-- Background Glow -->

    <div class="glow one"></div>
    <div class="glow two"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-crown"></i>
            </div>

            <div class="logo-text">
                LUXORA
            </div>

        </div>

        <div class="secure">

            <i class="fa-solid fa-shield-halved"></i>

            <span>Secure Booking</span>

        </div>

    </header>


    <!-- MAIN -->

    <main class="success-container">

        <section class="success-card">


            <!-- SUCCESS ICON -->

            <div class="success-icon">

                <i class="fa-solid fa-check"></i>

            </div>


            <!-- TITLE -->

            <h1>
                Payment Successful
            </h1>


            <p class="subtitle">

                Your luxury car reservation has been confirmed.
                Get ready for a premium driving experience with LUXORA.

            </p>


            <!-- BOOKING ID -->

            <div class="booking-box">

                <div>

                    <div class="booking-label">
                        Booking ID
                    </div>

                    <div class="booking-id" id="bookingId">
                        LUX-XXXXXX
                    </div>

                </div>

                <i class="fa-solid fa-circle-check"
                    style="color:#d4af37;font-size:22px;">
                </i>

            </div>


            <!-- DETAILS -->

            <div class="details">

                <div class="detail">

                    <i class="fa-solid fa-car"></i>

                    <span>Vehicle</span>

                    <strong id="carName">
                        Luxury Car
                    </strong>

                </div>


                <div class="detail">

                    <i class="fa-solid fa-calendar-check"></i>

                    <span>Booking Status</span>

                    <strong>
                        Confirmed
                    </strong>

                </div>


                <div class="detail">

                    <i class="fa-solid fa-credit-card"></i>

                    <span>Payment</span>

                    <strong>
                        Paid
                    </strong>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a href="my-bookings.html"
                    class="btn btn-primary">

                    <i class="fa-solid fa-calendar-days"></i>

                    My Bookings

                </a>


                <a href="index.html"
                    class="btn btn-secondary">

                    <i class="fa-solid fa-house"></i>

                    Back to Home

                </a>

            </div>


            <div class="footer-text">

                <i class="fa-solid fa-lock"></i>

                Your booking information is securely saved.

            </div>

        </section>

    </main>


    <script>

        /* =========================
           LOAD BOOKING DATA
        ========================= */

        const bookingData =
            JSON.parse(
                localStorage.getItem("luxoraLastBooking")
            );


        if (bookingData) {

            if (bookingData.bookingId) {

                document.getElementById("bookingId")
                    .textContent =
                    bookingData.bookingId;

            }


            if (bookingData.carName) {

                document.getElementById("carName")
                    .textContent =
                    bookingData.carName;

            }

        }


        /* =========================
           CREATE BOOKING ID
        ========================= */

        else {

            const randomId =
                "LUX-" +
                Math.random()
                    .toString(36)
                    .substring(2, 8)
                    .toUpperCase();

            document.getElementById("bookingId")
                .textContent = randomId;

        }


        /* =========================
           CONFETTI
        ========================= */

        function createConfetti() {

            const confettiCount = 55;

            for (
                let i = 0;
                i < confettiCount;
                i++
            ) {

                const piece =
                    document.createElement("div");

                piece.className = "confetti";


                piece.style.left =
                    Math.random() * 100 + "vw";


                piece.style.animationDuration =
                    (2.5 + Math.random() * 3) + "s";


                piece.style.animationDelay =
                    Math.random() * 1.5 + "s";


                const size =
                    5 + Math.random() * 5;

                piece.style.width =
                    size + "px";

                piece.style.height =
                    size * 1.6 + "px";


                /* Different luxury tones */

                const colors = [
                    "#d4af37",
                    "#f5d76e",
                    "#ffffff",
                    "#b8860b"
                ];

                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                document.body.appendChild(piece);


                setTimeout(() => {

                    piece.remove();

                }, 6000);

            }

        }


        /* Start celebration */

        setTimeout(
            createConfetti,
            500
        );


    </script>

</body>

</html>
