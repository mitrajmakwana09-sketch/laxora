<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUXORA | Create Account</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 15% 20%,
                    rgba(212, 175, 55, 0.12),
                    transparent 28%),
                radial-gradient(circle at 85% 80%,
                    rgba(212, 175, 55, 0.08),
                    transparent 30%),
                #050505;
            color: #ffffff;
            overflow-x: hidden;
        }


        /* ================================
           BACKGROUND
        ================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb-one {
            width: 250px;
            height: 250px;
            background: #b8860b;
            top: -80px;
            left: -80px;
        }

        .orb-two {
            width: 220px;
            height: 220px;
            background: #d4af37;
            right: -70px;
            bottom: -70px;
            animation-delay: 2s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -25px);
            }
        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            height: 75px;
            width: 100%;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            background: rgba(5, 5, 5, 0.72);
            backdrop-filter: blur(18px);

            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border: 1px solid #d4af37;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #d4af37;

            box-shadow:
                0 0 15px rgba(212, 175, 55, 0.18);
        }

        .logo-text {
            font-family: "Playfair Display", serif;
            font-size: 25px;
            letter-spacing: 4px;
            color: #ffffff;
        }

        .logo-text span {
            color: #d4af37;
        }

        .back-home {
            color: #bdbdbd;
            text-decoration: none;
            font-size: 14px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: 0.3s;
        }

        .back-home:hover {
            color: #d4af37;
            transform: translateX(-4px);
        }


        /* ================================
           MAIN
        ================================= */

        .register-wrapper {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 45px 20px;

            position: relative;
            z-index: 2;
        }


        /* ================================
           REGISTER CARD
        ================================= */

        .register-card {
            width: 100%;
            max-width: 950px;

            display: grid;
            grid-template-columns: 0.9fr 1.1fr;

            background: rgba(16, 16, 16, 0.82);

            border: 1px solid rgba(212, 175, 55, 0.2);

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 40px rgba(212, 175, 55, 0.06);

            backdrop-filter: blur(25px);

            animation: cardEntry 0.9s ease forwards;
        }

        @keyframes cardEntry {

            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* ================================
           LEFT SIDE
        ================================= */

        .luxury-side {
            min-height: 610px;
            padding: 50px 40px;

            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.95),
                    rgba(0, 0, 0, 0.2)
                ),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1000&q=85")
                center / cover no-repeat;
        }

        .luxury-side::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(212, 175, 55, 0.15),
                    transparent 45%
                );

            pointer-events: none;
        }

        .luxury-content {
            position: relative;
            z-index: 2;
        }

        .small-label {
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .luxury-side h1 {
            font-family: "Playfair Display", serif;
            font-size: 47px;
            line-height: 1.08;
            margin-bottom: 18px;
        }

        .luxury-side h1 span {
            color: #d4af37;
        }

        .luxury-side p {
            color: #c6c6c6;
            font-size: 14px;
            line-height: 1.8;
            max-width: 360px;
        }


        /* ================================
           RIGHT SIDE
        ================================= */

        .form-side {
            padding: 45px 50px;
            display: flex;
            align-items: center;
        }

        .form-container {
            width: 100%;
        }

        .form-title {
            font-family: "Playfair Display", serif;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .form-subtitle {
            color: #8f8f8f;
            font-size: 13px;
            margin-bottom: 28px;
        }


        /* ================================
           FORM
        ================================= */

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #cfcfcf;
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #777;

            transition: 0.3s;
        }

        .input-box input {
            width: 100%;
            height: 48px;

            padding: 0 45px;

            border-radius: 10px;

            border: 1px solid #292929;

            background: #0b0b0b;

            color: white;

            outline: none;

            font-family: inherit;

            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #555;
        }

        .input-box input:focus {
            border-color: #d4af37;

            box-shadow:
                0 0 0 3px rgba(212, 175, 55, 0.08),
                0 0 20px rgba(212, 175, 55, 0.06);
        }

        .input-box:focus-within i {
            color: #d4af37;
        }


        /* ================================
           PASSWORD
        ================================= */

        .password-toggle {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #777;

            cursor: pointer;

            transition: 0.3s;
        }

        .password-toggle:hover {
            color: #d4af37;
        }


        /* ================================
           TERMS
        ================================= */

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            margin: 5px 0 20px;

            color: #888;

            font-size: 11px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 2px;
            accent-color: #d4af37;
        }

        .terms a {
            color: #d4af37;
            text-decoration: none;
        }


        /* ================================
           BUTTON
        ================================= */

        .register-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #b8860b,
                #d4af37,
                #f0d477
            );

            color: #050505;

            font-size: 14px;
            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            position: relative;
            overflow: hidden;

            transition: 0.3s;

            box-shadow:
                0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .register-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background: rgba(255, 255, 255, 0.35);

            transform: skewX(-25deg);

            transition: 0.6s;
        }

        .register-btn:hover::before {
            left: 130%;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(212, 175, 55, 0.25);
        }

        .register-btn:active {
            transform: scale(0.98);
        }


        /* ================================
           LOGIN LINK
        ================================= */

        .login-text {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-top: 22px;
        }

        .login-text a {
            color: #d4af37;

            text-decoration: none;

            font-weight: 600;

            margin-left: 5px;

            transition: 0.3s;
        }

        .login-text a:hover {
            color: #f1d879;
        }


        /* ================================
           MESSAGE
        ================================= */

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 12px;

            text-align: center;
        }

        .message.success {
            display: block;

            color: #9ff0b2;

            background: rgba(52, 211, 101, 0.08);

            border: 1px solid rgba(52, 211, 101, 0.2);
        }

        .message.error {
            display: block;

            color: #ff9c9c;

            background: rgba(255, 70, 70, 0.08);

            border: 1px solid rgba(255, 70, 70, 0.2);
        }


        /* ================================
           LOADING
        ================================= */

        .loader {
            width: 17px;
            height: 17px;

            border: 2px solid rgba(0, 0, 0, 0.25);
            border-top-color: #050505;

            border-radius: 50%;

            display: inline-block;

            animation: spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 25px;
            }

            .register-card {
                grid-template-columns: 1fr;
                max-width: 560px;
            }

            .luxury-side {
                min-height: 300px;
                padding: 35px;
            }

            .luxury-side h1 {
                font-size: 38px;
            }

            .form-side {
                padding: 40px 30px;
            }
        }


        @media (max-width: 500px) {

            .navbar {
                height: 65px;
                padding: 0 18px;
            }

            .logo-text {
                font-size: 21px;
                letter-spacing: 3px;
            }

            .back-home {
                font-size: 12px;
            }

            .register-wrapper {
                padding: 25px 12px;
            }

            .register-card {
                border-radius: 18px;
            }

            .luxury-side {
                min-height: 270px;
                padding: 28px 24px;
            }

            .luxury-side h1 {
                font-size: 32px;
            }

            .luxury-side p {
                font-size: 12px;
            }

            .form-side {
                padding: 30px 22px;
            }

            .form-title {
                font-size: 29px;
            }

            .input-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

    </div>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-car-side"></i>
            </div>

            <div class="logo-text">
                LUX<span>ORA</span>
            </div>

        </a>


        <a href="index.html" class="back-home">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Home

        </a>

    </header>



    <!-- REGISTER AREA -->

    <main class="register-wrapper">


        <section class="register-card">


            <!-- LEFT IMAGE -->

            <div class="luxury-side">

                <div class="luxury-content">

                    <div class="small-label">
                        LUXURY CAR RENTAL
                    </div>

                    <h1>
                        Drive The
                        <span>Extraordinary.</span>
                    </h1>

                    <p>
                        Join LUXORA and unlock an exclusive collection
                        of premium vehicles designed for unforgettable
                        journeys.
                    </p>

                </div>

            </div>



            <!-- REGISTER FORM -->

            <div class="form-side">

                <div class="form-container">

                    <h2 class="form-title">
                        Create Account
                    </h2>

                    <p class="form-subtitle">
                        Start your luxury journey with LUXORA.
                    </p>


                    <form id="registerForm">


                        <!-- NAME -->

                        <div class="input-group">

                            <label>
                                Full Name
                            </label>

                            <div class="input-box">

                                <i class="fa-regular fa-user"></i>

                                <input
                                    type="text"
                                    id="name"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>

                        </div>



                        <!-- EMAIL + PHONE -->

                        <div class="input-row">

                            <div class="input-group">

                                <label>
                                    Email Address
                                </label>

                                <div class="input-box">

                                    <i class="fa-regular fa-envelope"></i>

                                    <input
                                        type="email"
                                        id="email"
                                        placeholder="you@email.com"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="input-group">

                                <label>
                                    Phone Number
                                </label>

                                <div class="input-box">

                                    <i class="fa-solid fa-phone"></i>

                                    <input
                                        type="tel"
                                        id="phone"
                                        placeholder="+91 XXXXX XXXXX"
                                        required
                                    >

                                </div>

                            </div>

                        </div>



                        <!-- PASSWORD -->

                        <div class="input-group">

                            <label>
                                Password
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Create a password"
                                    required
                                    minlength="6"
                                >

                                <span
                                    class="password-toggle"
                                    onclick="togglePassword('password', this)"
                                >

                                    <i class="fa-regular fa-eye"></i>

                                </span>

                            </div>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="input-group">

                            <label>
                                Confirm Password
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-shield-halved"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm your password"
                                    required
                                >

                                <span
                                    class="password-toggle"
                                    onclick="togglePassword('confirmPassword', this)"
                                >

                                    <i class="fa-regular fa-eye"></i>

                                </span>

                            </div>

                        </div>



                        <!-- TERMS -->

                        <label class="terms">

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                I agree to the
                                <a href="#">Terms & Conditions</a>
                                and
                                <a href="#">Privacy Policy</a>
                                of LUXORA.
                            </span>

                        </label>



                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="register-btn"
                            id="registerBtn"
                        >

                            Create LUXORA Account

                        </button>


                        <!-- MESSAGE -->

                        <div
                            class="message"
                            id="message"
                        ></div>


                        <!-- LOGIN -->

                        <div class="login-text">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </section>

    </main>



    <!-- JAVASCRIPT -->

    <script>

        /* ================================
           PASSWORD TOGGLE
        ================================= */

        function togglePassword(inputId, element) {

            const input = document.getElementById(inputId);

            const icon = element.querySelector("i");


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }



        /* ================================
           REGISTER
        ================================= */

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerBtn =
            document.getElementById("registerBtn");


        registerForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* PASSWORD CHECK */

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            /* BUTTON LOADING */

            registerBtn.disabled = true;

            registerBtn.innerHTML =
                '<span class="loader"></span> Creating Account...';


            /* DEMO REGISTER */

            setTimeout(function () {

                const user = {

                    name: name,

                    email: email,

                    phone: phone

                };


                localStorage.setItem(
                    "luxoraUser",
                    JSON.stringify(user)
                );


                localStorage.setItem(
                    "luxoraLoggedIn",
                    "true"
                );


                showMessage(
                    "Account created successfully. Welcome to LUXORA!",
                    "success"
                );


                registerBtn.innerHTML =
                    "Account Created ✓";


                /* REDIRECT */

                setTimeout(function () {

                    window.location.href =
                        "index.html";

                }, 1500);


            }, 1200);

        });



        /* ================================
           MESSAGE
        ================================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }

    </script>

</body>

</html>
